name: NormalTreeCapitator
version: '${project.version} Build ${buildNumber}'
main: dev.normaltreecapitator.NormalTreeCapitator
api-version: '1.20'
description: Cut down whole trees at once for Paper, Folia, Spigot, and Bukkit.
authors: [Agentsix1, Cristichi]
folia-supported: true

commands:
  tc:
    description: Tree Capitator controls
    usage: /tc help
    aliases: [treecapitator, treecap, normaltreecap]

permissions:
  normaltreecapitator.*:
    description: Gives access to every NormalTreeCapitator permission.
    default: op
    children:
      normaltreecapitator.admin: true
      normaltreecapitator.user: true
      normaltreecapitator.language: true

  normaltreecapitator.user:
    description: All basic player permissions (use, toggle, status, progress, help).
    default: true
    children:
      normaltreecapitator.use: true
      normaltreecapitator.toggle: true
      normaltreecapitator.status: true
      normaltreecapitator.progress: true
      normaltreecapitator.help: true

  normaltreecapitator.admin:
    description: All admin permissions (lookup others, reload, server language, toggle others, version, protected saplings, update alerts).
    default: op
    children:
      normaltreecapitator.admin.state: true
      normaltreecapitator.admin.reload: true
      normaltreecapitator.admin.language: true
      normaltreecapitator.admin.toggle.others: true
      normaltreecapitator.version: true

  normaltreecapitator.use:
    description: Allows tree capitator when breaking blocks
    default: true
  normaltreecapitator.toggle:
    description: Toggle tree capitator for yourself (/tc toggle)
    default: true
  normaltreecapitator.status:
    description: View your tree capitator toggle state (/tc)
    default: true
  normaltreecapitator.progress:
    description: View live chain break progress (/tc status)
    default: true
  normaltreecapitator.help:
    description: View /tc help for commands you can use
    default: true
  normaltreecapitator.version:
    description: View /tc version (and update link if outdated)
    default: op

  normaltreecapitator.language:
    description: Set your personal chat language (/tc language)
    default: false

  normaltreecapitator.admin.state:
    description: View another player's toggle state via /tc <player>
    default: op
  normaltreecapitator.admin.reload:
    description: Reload config files
    default: op
  normaltreecapitator.admin.language:
    description: Set the server default chat language (/tc language server)
    default: op
  normaltreecapitator.admin.toggle.others:
    description: Toggle tree capitator for other players
    default: op
